# ========================================================
# ClubSphere Production Orchestration (Docker Compose v2)
# ========================================================
# Unifies PostgreSQL 16, Express API Gateway, and Nginx SPA
# with isolated network tiers, automated health monitoring,
# and named persistent volumes.
# ========================================================

services:
  # ------------------------------------------------------
  # Database Service: PostgreSQL 16 with RLS & Triggers
  # ------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: clubsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clubsphere}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./documents/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clubsphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------
  # Backend API Gateway: Express 5 + Node.js 20 ESM
  # ------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clubsphere-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clubsphere}
      JWT_SECRET: ${JWT_SECRET:-clubsphere_jwt_super_secret_production_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-clubsphere_qr_hmac_secret_key_rotation_token}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TmAPu7Flpk7sJ4}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-TLjk1r96J8nzVuwdzAcg9MIO}
    volumes:
      - backend_media:/app/public/images
    networks:
      - backend_internal
      - frontend_public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ------------------------------------------------------
  # Frontend Web Client: Nginx Alpine Reverse Proxy & SPA
  # ------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clubsphere-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT_HTTP:-80}:80"
    networks:
      - frontend_public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# --------------------------------------------------------
# Network Topology Isolation
# --------------------------------------------------------
networks:
  frontend_public:
    driver: bridge
  backend_internal:
    driver: bridge
    internal: true

# --------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------
volumes:
  postgres_data:
    name: clubsphere_postgres_data
  backend_media:
    name: clubsphere_backend_media

# ========================================================
# ClubSphere Development Docker Compose Override
# Enables containerized live hot-reloading via bind mounts
# ========================================================

services:
  db:
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "dev"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/public:/app/public
    environment:
      NODE_ENV: development
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"

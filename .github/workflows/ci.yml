name: ClubSphere CI/CD Automation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality & Linting Gate
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies (clean)
        working-directory: frontend
        run: |
          rm -rf node_modules package-lock.json ../package-lock.json
          npm install

      - name: Verify Code Formatting (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Validate Backend JavaScript Syntax
        working-directory: backend
        run: |
          find src -name "*.js" -exec node --check {} +
          find test -name "*.js" -exec node --check {} +

  # ---------------------------------------------------------------------------
  # 2. Frontend Production Build & Bundle Inspection
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies (clean)
        working-directory: frontend
        run: |
          rm -rf node_modules package-lock.json ../package-lock.json
          npm install
          npm install --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu || true

      - name: Compile Production Static Bundle
        working-directory: frontend
        run: npm run build

      - name: Archive Production Assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Backend Database Migration & Automated Test Suite
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Database & Automated Unit/Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: clubsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/clubsphere_test
      JWT_SECRET: ci_test_super_secret_jwt_key_2026_test
      JWT_EXPIRES_IN: 7d
      QR_SIGNING_SECRET: ci_test_qr_secret_key_rotation_token_2026
      CORS_ORIGIN: http://localhost:5173
      RAZORPAY_KEY_ID: rzp_test_mock_key_ci
      RAZORPAY_KEY_SECRET: rzp_test_mock_secret_ci

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize PostgreSQL Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d clubsphere_test -f documents/schema.sql

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Seed Initial Test Data
        working-directory: backend
        run: node src/config/seedRealData.js

      - name: Run Backend Native Test Suite (node --test)
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------------
  # 4. Multi-Container Orchestration & Docker Build Verification
  # ---------------------------------------------------------------------------
  docker-validation:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Build Backend Docker Image
        run: |
          docker build -t clubsphere-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t clubsphere-frontend:test ./frontend
